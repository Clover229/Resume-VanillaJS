<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 네비 / 목차 -->
    <nav class="nav">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <!-- 소개 섹션 -->
    <section id="about">
      <h1 class="underline">안녕하세요, 홍길동입니다.</h1>
      <p class="underline">웹 퍼블리셔 • Front-end Engineer</p>
    </section>

    <!-- 경력 / 이력 섹션 -->
    <section id="experience">
      <h2 class="underline">Work Experience</h2>
      <ul>
        <li class="underline">회사 A (2023- ) — 프론트엔드 개발</li>
        <li class="underline">회사 B (2020-2023) — UI 개발</li>
      </ul>
    </section>

    <!-- 프로젝트 섹션 -->
    <section id="projects">
      <h2 class="underline">Projects</h2>
      <div class="project-list" id="project-list">
        <!-- JS로 카드들이 여기에 렌더링 됨 -->
      </div>
    </section>

    <!-- 연락처 / 기타 섹션 -->
    <section id="contact">
      <h2 class="underline">Contact</h2>
      <p class="underline">이메일: example@example.com</p>
    </section>

    <!-- Project Modal -->
    <div id="project-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 class="modal-title"></h2>
        <img class="modal-img" src="" alt="" />
        <p class="modal-desc"></p>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
    <script type="module" src="./js/scrollEffect.js"></script>
    <script type="module" src="./js/modal.js"></script>
    <script type="module" src="./js/projects.js"></script>
  </body>
</html>
